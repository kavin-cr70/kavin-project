<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antarctica – by Thomas House</title><style>
:root{--navy:#0b2545;--blue:#1d6fa5;--ice:#eaf4fb;--gold:#f2c14e;--ink:#1b2b3a}
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden;font-family:Calibri,"Segoe UI",Arial,sans-serif;background:#06162b}
.s{position:absolute;inset:0;display:none;padding:6vh 7vw 9vh;flex-direction:column;justify-content:center;overflow:hidden}
.s.on{display:flex}.s.c{background:var(--ice);color:var(--ink)}.s.c:before,.s.a:before{content:"";position:absolute;left:0;top:0;bottom:0;width:1.6vw;background:var(--blue)}
.s.t,.s.d,.s.e,.s.fin{background:var(--navy);color:#fff}.s.q{background:#0e5a8a;color:#fff}.s.a{background:var(--ice);color:var(--ink)}
.tag{font-size:max(12px,1.3vw);letter-spacing:.15em;font-weight:700;text-transform:uppercase;color:var(--blue);margin-bottom:1vh}.d .tag{color:#8fc4e8}.q .tag{color:var(--gold)}
h1,h2{font-family:Georgia,serif}h2{font-size:max(26px,3.6vw);color:var(--navy);margin-bottom:3vh}.d h2,.e h2{color:var(--gold)}.q h2{color:#fff;font-size:max(28px,4.4vw);line-height:1.25}
ul{list-style:none;display:grid;gap:1.6vh;max-width:1200px}
.c li{position:relative;padding-left:2vw;font-size:max(15px,1.95vw);line-height:1.4}
.c li:before{content:"";position:absolute;left:0;top:.6em;width:.8vw;height:.8vw;min-width:8px;min-height:8px;background:var(--blue);border-radius:50%}
.cards li{display:flex;align-items:center;gap:1.4vw;background:#16386b;border-radius:14px;padding:1.4vh 1.5vw;font-size:max(14px,1.8vw)}
.cards b{flex:none;width:2.8vw;height:2.8vw;min-width:28px;min-height:28px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center}
.t{flex-direction:row;align-items:center;gap:4vw}.t .l{flex:1.2}.t h1{font-size:max(44px,8vw);line-height:1}
.t em{display:block;font-family:Georgia,serif;font-size:max(18px,2.4vw);color:#bfe0f5;margin:1.5vh 0 3vh}
.t .by{font-size:max(20px,2.6vw);font-weight:700;border-top:4px solid var(--gold);padding-top:2vh;display:inline-block}
.t .kick{color:var(--gold);letter-spacing:.2em;font-weight:700;font-size:max(11px,1.2vw)}
.watch{display:inline-block;margin-top:4vh;background:var(--gold);color:var(--navy);font-weight:700;font-size:max(16px,2vw);padding:1.4vh 2.4vw;border-radius:50px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.4);transition:transform .2s}
.watch:hover{transform:scale(1.07)}
.img{flex:1;height:68vh;border:3px solid var(--gold);border-radius:14px;background:#16386b;overflow:hidden;box-shadow:0 0 40px rgba(242,193,78,.25)}.img img{width:100%;height:100%;object-fit:cover}
.e ul{color:#fff}.e li{font-size:max(15px,2vw);padding-left:2vw;position:relative}
.e li:before{content:"";position:absolute;left:0;top:.6em;width:.8vw;height:.8vw;background:#7ee8b0;border-radius:50%}
.e p{font:italic max(22px,3.2vw) Georgia,serif;color:#7ee8b0;margin-top:4vh}
.s.e{background:#2a1b5e}.e h2{color:#7ee8b0}
.a h2{font-size:max(22px,2.6vw)}
.a p{font-size:max(20px,3vw);line-height:1.4;font-weight:600;border-left:8px solid var(--gold);padding-left:2vw}
.fin{align-items:center;text-align:center}.fin h2{font:700 max(30px,5vw) Georgia,serif;color:#7ee8b0}
.fin .names{font-size:max(22px,3.4vw);font-weight:700;line-height:1.5}.fin .names span{color:var(--gold)}
.s.on>*{animation:up .7s both}.s.on>*:nth-child(2){animation-delay:.12s}.s.on li{animation:up .6s both}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
#bar{position:fixed;left:0;top:0;height:5px;background:linear-gradient(90deg,var(--gold),#7ee8b0);z-index:9;transition:width .4s}
#snow{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.5}
#nav{position:fixed;right:2vw;bottom:2vh;z-index:9;display:flex;gap:8px;align-items:center;color:#8aa4bd;font-size:14px}
#nav button{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:8px 14px;font-size:16px;cursor:pointer}
#fxn{margin-right:10px;color:var(--gold);font-weight:700;letter-spacing:.05em;min-width:90px;text-align:right}
</style></head><body><div id="bar"></div><div id="app"></div><canvas id="snow"></canvas>
<div id="nav"><span id="fxn"></span><span id="n"></span><button onclick="go(-1)" aria-label="Previous">‹</button><button onclick="go(1)" aria-label="Next">›</button><button onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()" aria-label="Fullscreen">⛶</button></div>
<script>
const TITLE_IMG="data:image/jpeg;base64,PASTE_YOUR_ORIGINAL_BASE64_HERE";
const VIDEO="https://www.youtube.com/watch?v=L0OyBXLA8CE";

const QA=[
["Why is Antarctica called the White Continent?","Because it is covered with a permanent cover of ice (in some places the ice cap is 4,000 metres deep), so it looks white."],
["Which mountain range divides Antarctica into West and East?","The Trans-Antarctic Mountains (3,200 km long)."],
["What is the highest peak in Antarctica and how tall is it?","Vinson Massif, which is 5,140 m tall."],
["Name the three Indian research stations in Antarctica.","Dakshin Gangotri, Maitri and Bharathi."],
["Why is mineral extraction not allowed in Antarctica?","The international agreement on the continent (Antarctic Treaty 1959 and Madrid Protocol 1991) does not permit it, to protect the fragile environment and keep it for peace and science."],
["What is blubber?","A thick layer of fat that helps animals and birds withstand the cold."],
["What causes an Aurora?","The interaction of charged particles from the sun with atoms in the upper atmosphere."],
["What is the Aurora of the South Pole called?","Aurora Australis, also called the Southern Lights."],
["Which is the largest research station in Antarctica?","McMurdo, set up by the United States of America."],
["Which months have continuous daylight in Antarctica?","December to February, when the sun never sets."],
["How many people live in Antarctica in winter?","About 1,000 people stay at the research stations during winter."],
["Name one vehicle used to travel on the ice in Antarctica.","A snowmobile, a Snow Cat (tracked vehicle), or a sledge."]
];

const S=[{"t":"title"},
{"t":"c","tag":"Location and Size","h":"Location and Size","pts":["Antarctica is a unique continent, but it does not have a native population. There is no country in Antarctica.","It is the southernmost and fifth-largest continent in the world.","Since it is located in the polar region, it is the coldest continent with a permanent cover of ice.","It is separated from the rest of the world by the icy waters of the southern portions of the Indian, Atlantic and Pacific Oceans.","It covers about 9.3% of the earth surface with an area of over 14 million sq km.","The South Pole lies near the centre of the continent, and most of Antarctica lies inside the Antarctic Circle."]},
{"t":"c","tag":"Location and Size","h":"Size in Perspective","pts":["Antarctica is about 1.4 times the size of Europe and is larger than Australia.","Only Asia, Africa, North America and South America are bigger than Antarctica.","Around 98% of the land is buried under ice.","Nobody lives here permanently. Only scientists and support staff stay at research stations.","The Antarctic Treaty (1959) keeps the continent for peace and science.","Seven countries once claimed parts of it, but the treaty has frozen all claims."]},
{"t":"d","tag":"Location and Size","f":["Antarctica is the largest piece of ice on the surface of Earth.","About 70% of Earth’s fresh water is in the Antarctic ice cap.","It is the only continent with no native population and no country.","It is about 1.4 times larger than Europe.","Scientists of any country are free to conduct experiments and collect data from Antarctica."]},

{"t":"c","tag":"Population","h":"Population of Antarctica","pts":["Antarctica has no permanent population and no native people.","Only scientists, engineers, doctors and support staff live here, and only for a limited time.","About 1,000 people stay during the winter at the research stations.","In summer, the number rises to about 4,000 to 5,000 people.","People from many countries work together, and some tourists visit during the summer months."]},

{"t":"c","tag":"Transport","h":"Transport in Antarctica","pts":["There are no roads or railways on the continent, so travel depends on special vehicles, ships and aircraft.","Icebreaker ships carry scientists and supplies through the icy waters of the Southern Ocean.","Aircraft, including planes fitted with skis and helicopters, fly people and goods to research stations.","On the ice, scientists travel by snowmobile, tracked Snow Cats and sledges.","Skis and sledges are used for short trips across the snow, where wheeled vehicles cannot go."]},

{"t":"c","tag":"Landforms","h":"Landforms and Divisions","pts":["The landforms consist of mountain ranges, peaks, valleys, glaciers, plateau, ice shelf, lakes and volcanoes.","The Trans-Antarctic Mountains are 3,200 km long and divide the continent into two halves: West Antarctica and East Antarctica.","West Antarctica faces the Pacific Ocean. The Antarctic Peninsula points towards South America and is a continuation of the Andes mountain range.","East Antarctica faces the Atlantic and Indian Oceans. It is the larger half and has the high Polar Plateau.","It is the only continent called the “White Continent”. In some places its ice cap is 4,000 metres deep."]},
{"t":"c","tag":"Landforms","h":"Peaks, Glaciers and Ice Shelves","pts":["Mt. Erebus, located on Ross Island in East Antarctica, is an active volcano.","Vinson Massif (5,140 m) is the highest peak. It is in the southern part of the Sentinel Range.","Lambert Glacier is the largest glacier in the world.","Ross Ice Shelf and Ronne-Filchner Ice Shelf are huge floating platforms of ice joined to the land.","Hidden under the ice are mountains, valleys and even lakes.","Glaciers flow slowly towards the sea, where pieces break off as icebergs."]},
{"t":"d","tag":"Landforms","f":["Vinson Massif (5,140 m) is the highest peak in Antarctica.","Lambert Glacier is the largest glacier in the world.","Mt. Erebus is an active volcano on Ross Island.","The Trans-Antarctic Mountains stretch 3,200 km across the continent.","Because of its thick ice, Antarctica is the highest continent on average."]},
{"t":"c","tag":"Climate","h":"Climate","pts":["Antarctica is the coldest continent. Extremely cold and icy winds blow throughout the year.","From December to February the sun never sets and there is continuous daylight.","The summer temperature is about 0°C.","Since the temperature remains below freezing point almost throughout the year, no major vegetation is found.","In winter the sun does not rise for months. This long darkness is called the polar night.","Inland winter temperatures can fall below −60°C."]},
{"t":"c","tag":"Climate","h":"Ice, Snow and Winds","pts":["Antarctica is a cold desert. It gets very little snowfall, but the snow never melts and piles up into thick ice.","It is the windiest and driest continent.","The lowest temperature ever recorded on Earth, about −89°C, was at Vostok Research Station (Russia).","The white ice reflects sunlight and helps keep the Earth cool.","Melting Antarctic ice could raise sea levels around the world, so scientists study it closely."]},
{"t":"d","tag":"Climate","f":["From December to February the sun never sets in Antarctica.","The lowest temperature ever recorded on Earth (about −89°C) was at Vostok Station.","Antarctica is a desert because it gets very little snow or rain.","In winter the sun stays below the horizon for months.","Even in summer, the temperature is only about 0°C."]},
{"t":"c","tag":"Flora and Fauna","h":"Flora (Plants)","pts":["Since the temperature remains below freezing point almost throughout the year, no major vegetation is found.","Simple plants such as algae, mosses, liverworts, lichens and microscopic fungi can survive and grow.","Some algae live in the snow, while other plants grow on the coastal rocky land that is ice free.","A few species of plants, such as plankton, algae and mosses, are seen in and around Antarctica’s fresh and saltwater lakes.","These tiny plants grow slowly and mostly in the short summer. Plankton is the base of the food chain."]},
{"t":"c","tag":"Flora and Fauna","h":"Fauna (Animals)","pts":["Small red krill are found in large shoals. They are the food for many warm-blooded sea animals.","Living creatures include whales, seals, walrus and sea birds such as penguins, albatross and polar skua.","The blue whale is the largest animal in the world and feeds on plankton.","All these animals and birds have a thick layer of fat called blubber, which helps them withstand the cold.","Penguins cannot fly. They have webbed feet and flippers instead of wings.","Small invertebrates are the only land animals that live on the continent."]},
{"t":"c","tag":"Animals","h":"Animals of Antarctica","pts":["Emperor penguins are the tallest penguins. They survive the long, dark winter by huddling together.","Adelie, Chinstrap and Gentoo penguins gather on the coast to breed during the summer.","Weddell, leopard and crabeater seals live on the sea ice and in the cold waters around the continent.","Orcas (killer whales), humpback whales and blue whales swim in the Southern Ocean.","Albatross, petrels and skuas are sea birds that fly over the ocean to find food."]},
{"t":"d","tag":"Flora and Fauna","f":["The blue whale is the largest animal in the world and it feeds on plankton.","Penguins in Antarctica cannot fly. They use flippers to swim.","Blubber, a thick layer of fat, keeps animals warm.","Krill gather in huge shoals and feed many sea animals.","Small invertebrates are the only land animals on the continent."]},
{"t":"c","tag":"Minerals","h":"Minerals","pts":["Scientific studies show that Antarctica is rich in gold, platinum, nickel, copper and petroleum.","Traces of chromium, lead, molybdenum, tin, uranium and zinc have also been found.","Possible resources also include silver, platinum, iron ore, cobalt, manganese and titanium.","Coal and hydrocarbons have been explored in minimal non-commercial quantities.","The international agreement on the continent does not permit the extraction of minerals. So, extraction of minerals does not take place."]},
{"t":"c","tag":"Minerals","h":"Why Mining Is Banned","pts":["The Antarctic Treaty (1959) reserves the continent for peaceful purposes and scientific research.","The Madrid Protocol (1991) bans mining and protects the Antarctic environment.","Mining and oil spills would harm the fragile ecosystem, which recovers very slowly.","The cold, thick ice and remote location make extraction costly and risky.","Protecting Antarctica keeps it a clean laboratory for the whole world."]},
{"t":"d","tag":"Minerals","f":["Antarctica is rich in gold, platinum, nickel, copper and petroleum.","No country is allowed to mine minerals in Antarctica.","The Antarctic Treaty was signed in 1959.","Coal has been explored only in minimal non-commercial quantities.","The Madrid Protocol (1991) protects the Antarctic environment."]},
{"t":"c","tag":"Expedition to Antarctica","h":"Expedition to Antarctica","pts":["In 1912, British and Norwegian teams reached the South Pole.","The Indian expedition team to Antarctica had 21 members with Dr. S. Z. Qasim as its leader.","The team left Goa on 6th December 1981 and landed in Antarctica on 9th January 1982.","Dakshin Gangotri, the first Indian scientific research station, was established in this continent.","Maitri and Bharathi are the other research stations of India in Antarctica.","Since then, Indian scientists have studied weather, ice, rocks and sea life in Antarctica."]},
{"t":"c","tag":"Expedition to Antarctica","h":"Research Stations","pts":["Dakshin Gangotri was India’s first base, set up soon after the first expedition.","Maitri is India’s second station. Bharathi, opened in 2012, is the newest.","McMurdo (USA) is the largest research station in Antarctica.","Vostok (Russia) and Halley (UK) are other stations shown on the map.","Scientists from many countries work together and share their findings."]},
{"t":"d","tag":"Expedition to Antarctica","f":["McMurdo is the largest research station in Antarctica. It was set up by the United States of America.","Dakshin Gangotri was the first Indian scientific research base station in Antarctica.","The Indian team had 21 members, led by Dr. S. Z. Qasim.","The first Indian team landed in Antarctica on 9th January 1982.","Maitri and Bharathi are India’s other research stations."]},
{"t":"c","tag":"Aurora","h":"Aurora","pts":["A natural curtain of a combination of bright pink, red and green colour light that appears in the sky near the north and south magnetic poles is called Aurora.","The effect is caused by the interaction of charged particles from the sun with atoms in the upper atmosphere.","It is also called Aurora Australis or Southern Lights at the South Pole, and Aurora Borealis or Northern Lights at the North Pole.","These amazing colours appear in the earth’s sky, especially in high-latitude places like Alaska in the north and New Zealand in the south."]},
{"t":"c","tag":"Aurora","h":"How an Aurora Forms","pts":["The sun sends out a stream of charged particles called the solar wind.","Earth’s magnetic field guides these particles towards the poles.","They collide with gases like oxygen and nitrogen, and the atoms glow.","Oxygen gives green and red light. Nitrogen gives blue and purple.","Auroras are best seen on dark, clear winter nights."]},
{"t":"d","tag":"Aurora","f":["Aurora Australis is also called the Southern Lights.","Aurora Borealis is also called the Northern Lights.","Auroras are caused by charged particles from the sun hitting atoms in the upper atmosphere.","Green is the most common aurora colour.","Alaska (north) and New Zealand (south) are famous places to see auroras."]},
{"t":"end","pts":["Antarctica is the southernmost and fifth largest continent in the world.","It is the coldest continent, with a permanent cover of ice, and has no native population.","Antarctica is rich in minerals, but mining is not permitted.","Indian research stations: Dakshin Gangotri, Maitri and Bharathi.","The interaction of charged particles from the sun with atoms in the upper atmosphere is called Aurora."]}
];
QA.forEach((x,i)=>{S.push({t:"q",n:i+1,x:x[0]});S.push({t:"a",n:i+1,x:x[0],a:x[1]});});
S.push({t:"fin"});

const app=document.getElementById('app');let cur=0;
const li=a=>a.map(t=>'<li>'+t+'</li>').join('');
const cards=a=>'<ul class="cards">'+a.map((t,k)=>'<li><b>'+(k+1)+'</b><span>'+t+'</span></li>').join('')+'</ul>';
S.forEach((s)=>{
 const d=document.createElement('section');
 d.className='s '+({title:'t',end:'e'}[s.t]||s.t);
 d.innerHTML=
  s.t=='title'?'<div class="l"><div class="kick">SOCIAL SCIENCE · MID-TERM PRESENTATION</div><h1>Antarctica</h1><em>The White Continent</em><div class="by">by Thomas House</div><br><a class="watch" href="'+VIDEO+'" target="_blank" rel="noopener">▶ Watch a Video</a></div><div class="img"><img src="'+TITLE_IMG+'" alt="St. Thomas"></div>'
 :s.t=='c'?'<div class="tag">'+s.tag+'</div><h2>'+s.h+'</h2><ul>'+li(s.pts)+'</ul>'
 :s.t=='d'?'<div class="tag">'+s.tag+'</div><h2>Did You Know?</h2>'+cards(s.f)
 :s.t=='end'?'<h2>Recap</h2><ul>'+li(s.pts)+'</ul><p>Now, 12 questions for the class!</p>'
 :s.t=='q'?'<div class="tag">Question '+s.n+' of 12</div><h2>'+s.x+'</h2>'
 :s.t=='a'?'<div class="tag">Answer '+s.n+' of 12</div><h2>'+s.x+'</h2><p>'+s.a+'</p>'
 :'<h2>Thank You!</h2><div class="names">PPT presented by<br><span>Kavin, Lidyan and Crispen</span></div>';
 app.appendChild(d);
});
const E=[...app.children];

/* ---------- TRANSITIONS ---------- */
const FX=[
 {n:'Fade',     kf:d=>[{opacity:0},{opacity:1}], ms:800},
 {n:'Slide',    kf:d=>[{transform:`translateX(${110*d}%)`,opacity:0},{transform:'translateX(0)',opacity:1}], ms:700},
 {n:'Zoom',     kf:d=>[{transform:'scale(.3)',opacity:0},{transform:'scale(1)',opacity:1}], ms:800},
 {n:'Flip',     kf:d=>[{transform:`perspective(1400px) rotateY(${-90*d}deg)`,opacity:0},{transform:'perspective(1400px) rotateY(0)',opacity:1}], ms:900},
 {n:'Iris',     kf:d=>[{clipPath:'circle(0% at 50% 50%)'},{clipPath:'circle(75% at 50% 50%)'}], ms:900},
 {n:'Wipe',     kf:d=>[{clipPath:d>0?'inset(0 100% 0 0)':'inset(0 0 0 100%)'},{clipPath:'inset(0 0% 0 0)'}], ms:800},
 {n:'Drop',     kf:d=>[{transform:'translateY(-110%)',opacity:0},{transform:'translateY(0)',opacity:1}], ms:1000, e:'cubic-bezier(.34,1.56,.64,1)'},
 {n:'Blur',     kf:d=>[{filter:'blur(24px)',opacity:0},{filter:'blur(0px)',opacity:1}], ms:900},
 {n:'Spin',     kf:d=>[{transform:`rotate(${-540*d}deg) scale(.1)`,opacity:0},{transform:'rotate(0deg) scale(1)',opacity:1}], ms:1100},
 {n:'Skew',     kf:d=>[{transform:`skewX(${30*d}deg) translateX(${-120*d}%)`,opacity:0},{transform:'none',opacity:1}], ms:800},
 {n:'Swing',    kf:d=>[{transform:'perspective(900px) rotateX(-80deg)',transformOrigin:'top center',opacity:0},{transform:'perspective(900px) rotateX(0deg)',transformOrigin:'top center',opacity:1}], ms:950},
 {n:'Bounce',   kf:d=>[{transform:`translateX(${-60*d}%) scale(.9)`,opacity:0},{transform:'translateX(0) scale(1)',opacity:1}], ms:1000, e:'cubic-bezier(.34,1.56,.64,1)'}
];
let lastFx=-1;
function pickFx(){let k;do{k=Math.floor(Math.random()*FX.length)}while(k===lastFx&&FX.length>1);lastFx=k;return FX[k];}

function show(i,d=1){
 cur=Math.max(0,Math.min(E.length-1,i));
 E.forEach((e,k)=>e.classList.toggle('on',k==cur));
 const el=E[cur];
 const fx=pickFx();
 el.animate(fx.kf(d),{duration:fx.ms,easing:fx.e||'cubic-bezier(.2,.8,.2,1)'});
 el.querySelectorAll('li').forEach((l,k)=>l.style.animationDelay=(.25+k*.15)+'s');
 document.getElementById('bar').style.width=((cur+1)/E.length*100)+'%';
 document.getElementById('n').textContent=(cur+1)+' / '+E.length;
 document.getElementById('fxn').textContent=fx.n;
}
function go(d){const n=cur+d;if(n<0||n>=E.length)return;show(n,d)}

addEventListener('keydown',e=>{
 if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key))go(1);
 if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))go(-1);
 if(e.key=='Home')show(0,-1);
 if(e.key=='End')show(E.length-1,1);
 if(e.key=='f')document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();});
let x0;addEventListener('touchstart',e=>x0=e.touches[0].clientX);
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)go(dx<0?1:-1)});

/* ---------- SNOW ---------- */
const cv=document.getElementById('snow'),cx=cv.getContext('2d');
let W,H,flakes=[];
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;
 flakes=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.6+.8,v:Math.random()*.7+.3,s:Math.random()*Math.PI*2}))}
function draw(){cx.clearRect(0,0,W,H);cx.fillStyle='#fff';
 for(const f of flakes){f.y+=f.v;f.s+=.01;f.x+=Math.sin(f.s)*.4;
  if(f.y>H){f.y=-5;f.x=Math.random()*W}
  cx.beginPath();cx.arc(f.x,f.y,f.r,0,Math.PI*2);cx.fill()}
 requestAnimationFrame(draw)}
addEventListener('resize',resize);resize();draw();

show(0);
</script></body></html>
