<script>
const S=[{"t":"title"},{"t":"c","tag":"Location and Size","h":"Location and Size","pts":["Antarctica is a unique continent, but it does not have a native population. There is no country in Antarctica.","It is the southernmost and fifth-largest continent in the world.","Since it is located in the polar region, it is the coldest continent with a permanent cover of ice.","It is separated from the rest of the world by the icy waters of the southern portions of the Indian, Atlantic and Pacific Oceans.","It covers about 9.3% of the earth surface with an area of over 14 million sq km.","The South Pole lies near the centre of the continent, and most of Antarctica lies inside the Antarctic Circle."],"i":0},{"t":"c","tag":"Location and Size","h":"Size in Perspective","pts":["Antarctica is about 1.4 times the size of Europe and is larger than Australia.","Only Asia, Africa, North America and South America are bigger than Antarctica.","Around 98% of the land is buried under ice.","Nobody lives here permanently. Only scientists and support staff stay at research stations.","The Antarctic Treaty (1959) keeps the continent for peace and science.","Seven countries once claimed parts of it, but the treaty has frozen all claims."],"i":0},{"t":"d","tag":"Location and Size","f":["Antarctica is the largest piece of ice on the surface of Earth.","About 70% of Earth’s fresh water is in the Antarctic ice cap.","It is the only continent with no native population and no country.","It is about 1.4 times larger than Europe.","Scientists of any country are free to conduct experiments and collect data from Antarctica."],"i":0},{"t":"q","tag":"Location and Size","f":["Which continent is the southernmost in the world?","What percentage of the earth surface does Antarctica cover?","Name the three oceans whose waters separate Antarctica from the rest of the world.","Why is Antarctica the coldest continent?","Why does Antarctica have no country of its own?"],"i":0},{"t":"c","tag":"Landforms","h":"Landforms and Divisions","pts":["The landforms consist of mountain ranges, peaks, valleys, glaciers, plateau, ice shelf, lakes and volcanoes.","The Trans-Antarctic Mountains are 3,200 km long and divide the continent into two halves: West Antarctica and East Antarctica.","West Antarctica faces the Pacific Ocean. The Antarctic Peninsula points towards South America and is a continuation of the Andes mountain range.","East Antarctica faces the Atlantic and Indian Oceans. It is the larger half and has the high Polar Plateau.","It is the only continent called the “White Continent”. In some places its ice cap is 4,000 metres deep."],"i":1},{"t":"c","tag":"Landforms","h":"Peaks, Glaciers and Ice Shelves","pts":["Mt. Erebus, located on Ross Island in East Antarctica, is an active volcano.","Vinson Massif (5,140 m) is the highest peak. It is in the southern part of the Sentinel Range.","Lambert Glacier is the largest glacier in the world.","Ross Ice Shelf and Ronne-Filchner Ice Shelf are huge floating platforms of ice joined to the land.","Hidden under the ice are mountains, valleys and even lakes.","Glaciers flow slowly towards the sea, where pieces break off as icebergs."],"i":1},{"t":"d","tag":"Landforms","f":["Vinson Massif (5,140 m) is the highest peak in Antarctica.","Lambert Glacier is the largest glacier in the world.","Mt. Erebus is an active volcano on Ross Island.","The Trans-Antarctic Mountains stretch 3,200 km across the continent.","Because of its thick ice, Antarctica is the highest continent on average."],"i":1},{"t":"q","tag":"Landforms","f":["Which mountain range divides Antarctica into two halves?","Name the two halves of Antarctica.","Which mountain range is the Antarctic Peninsula a continuation of?","Where is the active volcano Mt. Erebus located?","Why is Antarctica called the “White Continent”?"],"i":1},{"t":"c","tag":"Climate","h":"Climate","pts":["Antarctica is the coldest continent. Extremely cold and icy winds blow throughout the year.","From December to February the sun never sets and there is continuous daylight.","The summer temperature is about 0°C.","Since the temperature remains below freezing point almost throughout the year, no major vegetation is found.","In winter the sun does not rise for months. This long darkness is called the polar night.","Inland winter temperatures can fall below −60°C."],"i":2},{"t":"c","tag":"Climate","h":"Ice, Snow and Winds","pts":["Antarctica is a cold desert. It gets very little snowfall, but the snow never melts and piles up into thick ice.","It is the windiest and driest continent.","The lowest temperature ever recorded on Earth, about −89°C, was at Vostok Research Station (Russia).","The white ice reflects sunlight and helps keep the Earth cool.","Melting Antarctic ice could raise sea levels around the world, so scientists study it closely."],"i":2},{"t":"d","tag":"Climate","f":["From December to February the sun never sets in Antarctica.","The lowest temperature ever recorded on Earth (about −89°C) was at Vostok Station.","Antarctica is a desert because it gets very little snow or rain.","In winter the sun stays below the horizon for months.","Even in summer, the temperature is only about 0°C."],"i":2},{"t":"q","tag":"Climate","f":["Which months have continuous daylight in Antarctica?","What is the summer temperature of Antarctica?","Why is there no major vegetation in Antarctica?","What is the polar night?","How can melting Antarctic ice affect the world?"],"i":2},{"t":"c","tag":"Flora and Fauna","h":"Flora (Plants)","pts":["Since the temperature remains below freezing point almost throughout the year, no major vegetation is found.","Simple plants such as algae, mosses, liverworts, lichens and microscopic fungi can survive and grow.","Some algae live in the snow, while other plants grow on the coastal rocky land that is ice free.","A few species of plants, such as plankton, algae and mosses, are seen in and around Antarctica’s fresh and saltwater lakes.","These tiny plants grow slowly and mostly in the short summer. Plankton is the base of the food chain."],"i":3},{"t":"c","tag":"Flora and Fauna","h":"Fauna (Animals)","pts":["Small red krill are found in large shoals. They are the food for many warm-blooded sea animals.","Living creatures include whales, seals, walrus and sea birds such as penguins, albatross and polar skua.","The blue whale is the largest animal in the world and feeds on plankton.","All these animals and birds have a thick layer of fat called blubber, which helps them withstand the cold.","Penguins cannot fly. They have webbed feet and flippers instead of wings.","Small invertebrates are the only land animals that live on the continent."],"i":3},{"t":"d","tag":"Flora and Fauna","f":["The blue whale is the largest animal in the world and it feeds on plankton.","Penguins in Antarctica cannot fly. They use flippers to swim.","Blubber, a thick layer of fat, keeps animals warm.","Krill gather in huge shoals and feed many sea animals.","Small invertebrates are the only land animals on the continent."],"i":3},{"t":"q","tag":"Flora and Fauna","f":["Name three simple plants that grow in Antarctica.","What is blubber and how does it help animals?","Why can penguins not fly?","Which is the largest animal in the world and what does it eat?","Why are krill important?"],"i":3},{"t":"c","tag":"Minerals","h":"Minerals","pts":["Scientific studies show that Antarctica is rich in gold, platinum, nickel, copper and petroleum.","Traces of chromium, lead, molybdenum, tin, uranium and zinc have also been found.","Possible resources also include silver, platinum, iron ore, cobalt, manganese and titanium.","Coal and hydrocarbons have been explored in minimal non-commercial quantities.","The international agreement on the continent does not permit the extraction of minerals. So, extraction of minerals does not take place."],"i":4},{"t":"c","tag":"Minerals","h":"Why Mining Is Banned","pts":["The Antarctic Treaty (1959) reserves the continent for peaceful purposes and scientific research.","The Madrid Protocol (1991) bans mining and protects the Antarctic environment.","Mining and oil spills would harm the fragile ecosystem, which recovers very slowly.","The cold, thick ice and remote location make extraction costly and risky.","Protecting Antarctica keeps it a clean laboratory for the whole world."],"i":4},{"t":"d","tag":"Minerals","f":["Antarctica is rich in gold, platinum, nickel, copper and petroleum.","No country is allowed to mine minerals in Antarctica.","The Antarctic Treaty was signed in 1959.","Coal has been explored only in minimal non-commercial quantities.","The Madrid Protocol (1991) protects the Antarctic environment."],"i":4},{"t":"q","tag":"Minerals","f":["Name four minerals found in Antarctica.","Is mineral extraction allowed in Antarctica?","Why would mining be a danger to Antarctica?","What is the purpose of the Antarctic Treaty?","Do you think Antarctica should stay free from mining? Why?"],"i":4},{"t":"c","tag":"Expedition to Antarctica","h":"Expedition to Antarctica","pts":["In 1912, British and Norwegian teams reached the South Pole.","The Indian expedition team to Antarctica had 21 members with Dr. S. Z. Qasim as its leader.","The team left Goa on 6th December 1981 and landed in Antarctica on 9th January 1982.","Dakshin Gangotri, the first Indian scientific research station, was established in this continent.","Maitri and Bharathi are the other research stations of India in Antarctica.","Since then, Indian scientists have studied weather, ice, rocks and sea life in Antarctica."],"i":5},{"t":"c","tag":"Expedition to Antarctica","h":"Research Stations","pts":["Dakshin Gangotri was India’s first base, set up soon after the first expedition.","Maitri is India’s second station. Bharathi, opened in 2012, is the newest.","McMurdo (USA) is the largest research station in Antarctica.","Vostok (Russia) and Halley (UK) are other stations shown on the map.","Scientists from many countries work together and share their findings."],"i":5},{"t":"d","tag":"Expedition to Antarctica","f":["McMurdo is the largest research station in Antarctica. It was set up by the United States of America.","Dakshin Gangotri was the first Indian scientific research base station in Antarctica.","The Indian team had 21 members, led by Dr. S. Z. Qasim.","The first Indian team landed in Antarctica on 9th January 1982.","Maitri and Bharathi are India’s other research stations."],"i":5},{"t":"q","tag":"Expedition to Antarctica","f":["Who led the first Indian expedition to Antarctica?","When did the team leave Goa and when did it land in Antarctica?","Name the three Indian research stations in Antarctica.","Which is the largest research station in Antarctica?","Why do scientists from many countries work in Antarctica?"],"i":5},{"t":"c","tag":"Aurora","h":"Aurora","pts":["A natural curtain of a combination of bright pink, red and green colour light that appears in the sky near the north and south magnetic poles is called Aurora.","The effect is caused by the interaction of charged particles from the sun with atoms in the upper atmosphere.","It is also called Aurora Australis or Southern Lights at the South Pole, and Aurora Borealis or Northern Lights at the North Pole.","These amazing colours appear in the earth’s sky, especially in high-latitude places like Alaska in the north and New Zealand in the south."],"i":6},{"t":"c","tag":"Aurora","h":"How an Aurora Forms","pts":["The sun sends out a stream of charged particles called the solar wind.","Earth’s magnetic field guides these particles towards the poles.","They collide with gases like oxygen and nitrogen, and the atoms glow.","Oxygen gives green and red light. Nitrogen gives blue and purple.","Auroras are best seen on dark, clear winter nights."],"i":6},{"t":"d","tag":"Aurora","f":["Aurora Australis is also called the Southern Lights.","Aurora Borealis is also called the Northern Lights.","Auroras are caused by charged particles from the sun hitting atoms in the upper atmosphere.","Green is the most common aurora colour.","Alaska (north) and New Zealand (south) are famous places to see auroras."],"i":6},{"t":"q","tag":"Aurora","f":["What is an Aurora?","What causes an Aurora?","What is the Aurora at the South Pole called?","Name two places where auroras are seen.","Which gas gives the common green colour?"],"i":6},{"t":"end","pts":["Antarctica is the southernmost and fifth largest continent in the world.","It is the coldest continent, with a permanent cover of ice, and has no native population.","Antarctica is rich in minerals, but mining is not permitted.","Indian research stations: Dakshin Gangotri, Maitri and Bharathi.","The interaction of charged particles from the sun with atoms in the upper atmosphere is called Aurora."]},{"t":"q10","f":["Why is Antarctica called the White Continent?","Which mountain range divides Antarctica into West and East?","What is the highest peak in Antarctica and how tall is it?","Name the three Indian research stations in Antarctica.","Why is mineral extraction not allowed in Antarctica?","What is blubber?","What causes an Aurora?","What is the Aurora of the South Pole called?","Which is the largest research station in Antarctica?","Which months have continuous daylight in Antarctica?"]},{"t":"img"}];const app=document.getElementById('app');let cur=0;
